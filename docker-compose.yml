# docker compose --profile dev up -d
services:
  app:
    container_name: piku-prod-app
    profiles:
      - "prod"
    depends_on:
      - prod-db
      - redis
    build:
      context: .
    env_file:
      - .env
    environment:
      PROFILE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      PROD_DB_URL: jdbc:mysql://prod-db:3306/piku_prod
      PROD_REDIS_URL: redis
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-credentials.json
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./logs:/app/logs
      - ./${GOOGLE_APPLICATION_CREDENTIALS}:/app/firebase-credentials.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT:-8080}/actuator || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - default
      - piku-network

  db:
    image: mysql:8.0
    container_name: dev-piku-mysql
    ports:
      - "9915:3306"
    profiles:
      - "dev"
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD:-1234}
      MYSQL_DATABASE: piku
    volumes:
      - dev-piku-data:/var/lib/mysql
    networks:
      - dev-piku-network

  prod-db:
    image: mysql:8.0
    container_name: piku-prod-mysql
    ports:
      - "9914:3306"
    profiles:
      - "prod"
      - "dev-server"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_PASSWORD:-1234}
      MYSQL_DATABASE: piku_prod
    volumes:
      - piku-data:/var/lib/mysql
    networks:
      - piku-network

  minio:
    image: minio/minio:latest
    container_name: piku-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"    # MinIO API 포트 (환경 변수로 관리 또는 기본값 9000)
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Console 포트 (환경 변수로 관리 또는 기본값 9001)
    profiles:
      - "dev"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}       # .env 파일 또는 기본값 minioadmin 사용
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin} # .env 파일 또는 기본값 minioadmin 사용
    volumes:
      - ./minio-data:/data # MinIO 데이터 지속성을 위한 볼륨
    networks:
      - dev-piku-network # dev 프로필 서비스 접근용
      - piku-network     # prod 프로필 서비스 접근용
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: piku-prometheus
    ports:
      - "9090:9090"
    profiles:
      - "dev"
      - "dev-server"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dev-piku-network
      - piku-network

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: piku-grafana
    depends_on:
      - prometheus
    ports:
      - "3010:3000"
    profiles:
      - "dev"
      - "dev-server"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/placeholder}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - dev-piku-network
      - piku-network
  # ---- MinIO 버킷/정책 자동 적용 (처음/필요 시 1회) ----
  minio-provision:
    image: minio/mc:latest
    container_name: piku-minio-provision
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - "dev"
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-piku}
      PUBLIC_PREFIX: ${PUBLIC_PREFIX:-public/}
      FIXED_CHARACTER_PREFIX: ${FIXED_CHARACTER_PREFIX:-public/characters/fixed/}
      FIXED_CHARACTER_SOURCE_DIR: /fixed-characters
    networks:
      - dev-piku-network
      - piku-network
    volumes:
      - ./minio-init/init.sh:/init.sh:ro
      - ./characters/fixed:/fixed-characters:ro
    entrypoint: ["/bin/sh","/init.sh"]
    restart: "no"

volumes:
  piku-data:
  dev-piku-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  piku-network:
    driver: bridge
  dev-piku-network:
    driver: bridge

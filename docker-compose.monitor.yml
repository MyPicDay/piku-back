name: piku-monitor

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: piku-prometheus
    ports:
      - "9090:9090"
    environment:
      MONITORING_TARGET: ${MONITORING_TARGET:-host.docker.internal:8080}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./monitoring/prometheus/render-config.sh:/etc/prometheus/render-config.sh:ro
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/etc/prometheus/render-config.sh"]
    command:
      - "--config.file=/tmp/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: piku-grafana
    depends_on:
      - prometheus
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/placeholder}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:

services:
  minio:
    image: minio/minio:latest
    container_name: piku-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  minio-provision:
    image: minio/mc:latest
    container_name: piku-minio-provision
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-piku}
      PUBLIC_PREFIX: ${PUBLIC_PREFIX:-public/}
      FIXED_CHARACTER_PREFIX: ${FIXED_CHARACTER_PREFIX:-public/characters/fixed/}
      FIXED_CHARACTER_SOURCE_DIR: /fixed-characters
    volumes:
      - ./minio-init/init.sh:/init.sh:ro
      - ./characters/fixed:/fixed-characters:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

volumes:
  redis-data:

apiVersion: 1

groups:
  - orgId: 1
    name: health-check-alerts
    folder: Health Check
    interval: 1m
    rules:
      - uid: server-down-alert
        title: Piku Backend Server Down
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="piku-back"} == 0
              format: time_series
              instant: false
              interval: ""
              intervalMs: 15000
              legendFormat: "{{job}}"
              maxDataPoints: 43200
              refId: A
        for: 1m
        annotations:
          summary: 'Piku Backend server is down'
          description: 'The piku-back server has been unreachable for more than 1 minute. Prometheus cannot scrape metrics from the /actuator/prometheus endpoint.'
        labels:
          severity: critical
        noDataState: Alerting
        execErrState: Alerting

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
#    url: ${DEV_DB_URL:jdbc:log4jdbc:mysql://localhost:9915/piku} # 개발용 DB URL
    url: ${DEV_DB_URL:jdbc:mysql://localhost:9915/piku} # 개발용 DB URL
    username: ${DEV_DB_USERNAME:root}
    password: ${DEV_DB_PASSWORD:1234}
    #    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DEV_DB_DDL_AUTO:update}
    show-sql: ${DEV_DB_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${DEV_DB_FORMAT_SQL:true}
        use_sql_comments: ${DEV_DB_USE_SQL_COMMENTS:true}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: false
admin:
  security:
    secure-cookies: false
    csrf-cookie-domain: ""
  otp:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

springdoc:
  swagger-ui:
    with-credentials: true
    csrf:
      enabled: true
      cookie-name: ${ADMIN_CSRF_COOKIE_NAME:csrf_token}
      header-name: ${ADMIN_CSRF_HEADER_NAME:csrf_header}

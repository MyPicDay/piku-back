name: Release backend jar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSET_NAME: pikumi-backend.jar
  CHECKSUM_NAME: pikumi-backend.jar.sha256
  RELEASE_TAG_PREFIX: backend
  RELEASE_KEEP_COUNT: "5"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint docs structure
        run: bash scripts/docs-lint.sh

      - name: Build and test release jar
        env:
          PROFILE: prod
        run: ./gradlew clean test bootJar

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' | sort | head -n 1)"
          if [[ -z "${jar_path}" ]]; then
            echo "No boot jar found under build/libs" >&2
            exit 1
          fi
          cp "${jar_path}" "release-assets/${ASSET_NAME}"
          cd release-assets
          sha256sum "${ASSET_NAME}" > "${CHECKSUM_NAME}"

      - name: Resolve release tag
        id: release_version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          release_date="$(date -u +'%Y%m%d')"
          tag_name="${RELEASE_TAG_PREFIX}-${release_date}-${short_sha}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_version.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              "release-assets/${ASSET_NAME}" \
              "release-assets/${CHECKSUM_NAME}" \
              --clobber
          else
            gh release create "${TAG_NAME}" \
              "release-assets/${ASSET_NAME}" \
              "release-assets/${CHECKSUM_NAME}" \
              --title "${TAG_NAME}" \
              --notes "Automated backend release for ${GITHUB_SHA}."
          fi

      - name: Keep recent backend releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName,createdAt \
            --jq "map(select(.tagName | startswith(\"${RELEASE_TAG_PREFIX}-\"))) | sort_by(.createdAt) | reverse | .[${RELEASE_KEEP_COUNT}:][]?.tagName" |
          while IFS= read -r old_tag; do
            if [[ -n "${old_tag}" ]]; then
              gh release delete "${old_tag}" --cleanup-tag --yes
            fi
          done
